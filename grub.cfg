# DiyorOS — GRUB menyusi (v0.9)
#
# Kernel GRUB dan grafik ekran so'raydi (boot.s dagi multiboot sarlavhasi):
# BIOS li kompyuterda VBE orqali, UEFI li kompyuterda GOP orqali. Matn
# konsolini kernel o'zi chizadi (fbcon.c), "gui" ham shu ekranda ochiladi.
# Grafik rejimni yoqib bo'lmasa, GRUB oddiy VGA matn rejimini beradi —
# kernel buni ham taniydi.

set timeout=2
set default=0

insmod all_video

menuentry "DiyorOS" {
    multiboot /boot/diyoros.bin
    boot
}
